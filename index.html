<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container" role="region" aria-roledescription="carousel" aria-label="Featured Images">
        <div class="carousel-track-container">
            <ul class="carousel-track">
                <li class="carousel-slide current-slide">
                    <img class="carousel-image" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" alt="Landscape 1">
                </li>
                <li class="carousel-slide">
                    <img class="carousel-image" src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1200&q=80" alt="Landscape 2">
                </li>
                <li class="carousel-slide">
                    <img class="carousel-image" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="Landscape 3">
                </li>
                <li class="carousel-slide">
                    <img class="carousel-image" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80" alt="Landscape 4">
                </li>
            </ul>
        </div>

        <button class="carousel-button carousel-button--left is-hidden" aria-label="Previous Slide">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="carousel-button carousel-button--right" aria-label="Next Slide">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

        <div class="carousel-nav">
            <button class="carousel-indicator current-slide" aria-label="Go to slide 1"></button>
            <button class="carousel-indicator" aria-label="Go to slide 2"></button>
            <button class="carousel-indicator" aria-label="Go to slide 3"></button>
            <button class="carousel-indicator" aria-label="Go to slide 4"></button>
        </div>

        <div class="carousel-progress-bar">
            <div class="carousel-progress-fill"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
